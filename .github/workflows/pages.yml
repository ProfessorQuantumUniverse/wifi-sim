name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nothing gets published that has not passed the validation suite.
      - name: Validation suite
        run: npm test

      # Pages serves the site from a subdirectory named after the repository,
      # so every asset URL needs that prefix.
      - name: Build the app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Build the docs
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}/docs/
        run: npm run docs:build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r dist/* _site/
          mkdir -p _site/docs
          cp -r docs/.vitepress/dist/* _site/docs/
          # Pages runs Jekyll otherwise, which silently drops files whose
          # names begin with an underscore.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
