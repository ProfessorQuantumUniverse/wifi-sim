name: Release

# Tag a commit as v1.2.3 and push the tag to cut a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    name: Verify before publishing anything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Kept in step with ci.yml; see the note there.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package the built app
        run: |
          cd dist
          zip -r ../wifi-sim-dist.zip .

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: wifi-sim-dist.zip
          generate_release_notes: true
          body: |
            ## Ways to run this

            **In a browser, nothing to install**
            https://professorquantumuniverse.github.io/wifi-sim/

            **Locally, one command**
            ```
            npx wifi-sim@latest
            ```

            **In a container**
            ```
            docker run --rm -p 8080:8080 ghcr.io/professorquantumuniverse/wifi-sim:latest
            ```

            **On your own web server**
            Download `wifi-sim-dist.zip` below and serve the contents as static
            files. It needs an HTTP origin rather than the file system, because
            the tracing and solving run in Web Workers.

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # Authenticates by OIDC through npm trusted publishing, so there is no
    # publish token anywhere in this repository. npm has to be told to trust
    # this workflow first: the package's settings on npmjs.com name the owner,
    # the repository and this file, and a publish is only accepted when all
    # three match. Renaming this file therefore breaks publishing until the
    # trusted publisher is updated to the new name.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Kept in step with ci.yml; see the note there.
      - run: npm install -g npm@11
      - run: npm ci

      # The tag is the one source of truth for the version. Without this the
      # publish would keep shipping whatever package.json happens to say, while
      # the container image gets tagged from the tag, and the two would drift
      # apart on the very first release that forgets to bump by hand.
      - name: Take the version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm run build

      # No --provenance flag: trusted publishing attaches the attestation by
      # itself, and passing it alongside OIDC is redundant.
      - name: Publish
        run: npm publish --access public

  docker:
    name: Publish the container image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
