name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # The validation suite is the reason to trust anything this project
      # prints, so it runs on every push and every pull request.
      - name: Validation suite
        run: npm test

      - name: Build the app
        run: npm run build

      - name: Build the docs
        run: npm run docs:build
