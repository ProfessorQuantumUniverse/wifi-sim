server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The app is a single page. Anything that is not a real file is the app.
    location / {
        try_files $uri /index.html;
    }

    # Asset filenames carry a content hash, so they can be cached hard. The
    # entry document must not be, or an update would never be picked up.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
